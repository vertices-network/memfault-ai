name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m py_compile config.py memfault_client.py agent_memory.py ui.py claude_analyzer.py autonomous_agent.py main.py
